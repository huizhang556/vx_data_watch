name: vx-data-watch

services:
  app:
    container_name: vx-data-watch-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${VX_NODE_IMAGE:-node:24-alpine}
        PYTHON_IMAGE: ${VX_PYTHON_IMAGE:-python:3.12-slim}
    image: ${VX_IMAGE:-vx-data:local}
    ports:
      - "${VX_BIND_ADDRESS:-127.0.0.1}:${VX_PORT:-8000}:8000"
    environment:
      VX_DATA_DIR: /app/data
      VX_DATABASE_URL: sqlite:////app/data/vx_data.db
      VX_COOKIE_SECURE: ${VX_COOKIE_SECURE:-false}
      VX_SESSION_DAYS: ${VX_SESSION_DAYS:-14}
      VX_MAX_UPLOAD_MB: ${VX_MAX_UPLOAD_MB:-20}
      VX_MASTER_KEY: ${VX_MASTER_KEY:-}
      VX_UPDATER_ENABLED: "true"
      VX_UPDATE_REPOSITORY: ${VX_UPDATE_REPOSITORY:-litehub/vx-data-watch}
      VX_REGISTRATION_ENABLED: ${VX_REGISTRATION_ENABLED:-false}
      VX_SMTP_HOST: ${VX_SMTP_HOST:-}
      VX_SMTP_PORT: ${VX_SMTP_PORT:-587}
      VX_SMTP_USERNAME: ${VX_SMTP_USERNAME:-}
      VX_SMTP_PASSWORD: ${VX_SMTP_PASSWORD:-}
      VX_SMTP_FROM: ${VX_SMTP_FROM:-}
      VX_SMTP_STARTTLS: ${VX_SMTP_STARTTLS:-true}
      VX_SMTP_SSL: ${VX_SMTP_SSL:-false}
      VX_CAPTCHA_ENABLED: ${VX_CAPTCHA_ENABLED:-false}
      VX_CAPTCHA_PROVIDER: ${VX_CAPTCHA_PROVIDER:-turnstile}
      VX_CAPTCHA_SITE_KEY: ${VX_CAPTCHA_SITE_KEY:-}
      VX_CAPTCHA_SECRET_KEY: ${VX_CAPTCHA_SECRET_KEY:-}
      VX_VERIFICATION_CODE_MINUTES: ${VX_VERIFICATION_CODE_MINUTES:-10}
    volumes:
      - vx-data:/app/data
    restart: unless-stopped

  updater:
    container_name: vx-data-watch-updater
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${VX_NODE_IMAGE:-node:24-alpine}
        PYTHON_IMAGE: ${VX_PYTHON_IMAGE:-python:3.12-slim}
    image: ${VX_IMAGE:-vx-data:local}
    command: ["python", "-m", "app.updater"]
    user: root
    environment:
      VX_DATA_DIR: /app/data
      VX_UPDATE_REPOSITORY: ${VX_UPDATE_REPOSITORY:-litehub/vx-data-watch}
      VX_UPDATE_ENV_FILE: /project/.env
      VX_UPDATE_PROJECT: vx-data-watch
      VX_UPDATE_SERVICE: app
      VX_APP_UID: "10001"
      VX_APP_GID: "10001"
    volumes:
      - vx-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ./.env
        target: /project/.env
        bind:
          create_host_path: false
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vx-data:
    name: vx-data
