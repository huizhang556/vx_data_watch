name: Build Candidate Image

on:
  workflow_dispatch:
    inputs:
      push_candidate:
        description: Push the validated candidate image to Docker Hub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: docker.io/litehub/vx-data-watch

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install backend dependencies from lock file
        run: uv sync --locked --extra dev
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --format requirements-txt --no-dev --extra ocr --extra postgres --output-file /tmp/vx-requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/vx-requirements.txt
      - name: Ruff for update modules
        run: uv run ruff check backend/app/updater.py backend/app/updates.py
      - name: Pytest
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build:
    name: Build and optionally push candidate
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: inputs.push_candidate
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = \"\([0-9][0-9.]*\)\"$/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - name: Build compatible candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push_candidate }}
          load: ${{ !inputs.push_candidate }}
          tags: ${{ env.DOCKERHUB_IMAGE }}:candidate-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.DOCKERHUB_IMAGE }}:candidate-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Verify candidate metadata
        shell: bash
        env:
          CANDIDATE: ${{ env.DOCKERHUB_IMAGE }}:candidate-${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${{ inputs.push_candidate }}" == "true" ]]; then
            docker pull "$CANDIDATE"
          fi
          version="$(docker image inspect "$CANDIDATE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          revision="$(docker image inspect "$CANDIDATE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$version" == "$EXPECTED_VERSION" ]] || { echo "Candidate version mismatch: $version != $EXPECTED_VERSION"; exit 1; }
          [[ "$revision" == "${{ github.sha }}" ]] || { echo "Candidate revision mismatch: $revision"; exit 1; }
          echo "Candidate metadata verified: version=$version revision=$revision"
      - name: Print candidate reference
        if: inputs.push_candidate
        run: |
          echo "Candidate: ${{ env.DOCKERHUB_IMAGE }}:candidate-${{ github.sha }}"
